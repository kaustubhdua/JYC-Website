name: JYC Browser QA

concurrency:
  group: jyc-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        env:
          VITE_JYC_QA_FIXTURES: 'true'
        run: npm run build

      - name: Run browser smoke and responsive QA against production preview
        env:
          JYC_UPDATE_VISUAL_BASELINES: ${{ contains(github.event.head_commit.message || '', '[visual-baseline-bootstrap]') && 'true' || 'false' }}
        run: npm run qa:browser
      - name: Upload Playwright reports and visual route captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jyc-playwright-and-visual-report
          path: |
            playwright-report
            test-results
            scripts/visual-route-matrix.spec.js-snapshots
          if-no-files-found: ignore
      - name: Upload visual baseline bootstrap
        if: success() && contains(github.event.head_commit.message || '', '[visual-baseline-bootstrap]')
        uses: actions/upload-artifact@v7
        with:
          name: jyc-visual-baselines-bootstrap
          path: scripts/visual-route-matrix.spec.js-snapshots
          if-no-files-found: error

  commit-visual-baselines:
    if: github.event_name == 'push' && contains(github.event.head_commit.message || '', '[visual-baseline-bootstrap]')
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Download visual baselines
        uses: actions/download-artifact@v8
        with:
          name: jyc-visual-baselines-bootstrap
          path: /tmp/jyc-visual-baselines
      - name: Commit initial route screenshot baselines
        shell: bash
        run: |
          set -euo pipefail
          snapshot_dir=scripts/visual-route-matrix.spec.js-snapshots
          mkdir -p "$snapshot_dir"
          cp -R /tmp/jyc-visual-baselines/. "$snapshot_dir/"
          test -n "$(git status --porcelain -- "$snapshot_dir")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$snapshot_dir"
          git commit -m "test(visual): establish initial JYC route screenshot baselines"
          git push origin HEAD:main
