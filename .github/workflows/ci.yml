name: JYC CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: jyc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - run: npm run qa
      - run: npm run qa:seo
      - run: npm run qa:v64-editorial
      - run: npm run qa:photo-intelligence
      - run: npm run build
      - name: Enforce production media/performance budget
        run: node scripts/qa-performance.mjs

