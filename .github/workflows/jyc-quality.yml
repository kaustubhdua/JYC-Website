name: JYC Quality Gate

concurrency:
  group: jyc-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Install pinned Khronos glTF validator for assistant asset QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gltf-validator"
          cd "$RUNNER_TEMP/gltf-validator"
          npm pack gltf-validator@2.0.0-dev.3.10 --silent
          mkdir -p "$GITHUB_WORKSPACE/node_modules/gltf-validator"
          tar -xzf gltf-validator-2.0.0-dev.3.10.tgz -C "$GITHUB_WORKSPACE/node_modules/gltf-validator" --strip-components=1

      - name: Production build
        run: npm run build

      - name: Run full static release QA
        run: npm run qa


      - name: Enforce production build media/performance budget
        run: node scripts/qa-performance.mjs


      - name: Verify canonical event identifiers
        run: npm run qa:identifiers

      - name: Verify canonical sitemap
        run: npm run qa:sitemap

      - name: Verify current release contracts
        run: |
          npm run qa:dependency-lock
          npm run qa:v64-editorial
          npm run qa:photo-intelligence
          npm run qa:seo

      - name: Reject accidental Vercel preview references
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git grep -nE 'https://jyc-website-[a-z0-9]+-[a-z0-9]+\.vercel\.app' -- ':!README.md' ':!docs/**' || true)"
          test -z "$(git ls-files '*.zip')"
