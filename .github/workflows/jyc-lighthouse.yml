name: JYC Lighthouse CI

on:
  pull_request:
    branches: [main, 'fix/**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jyc-lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate Lighthouse server readiness matcher
        run: node scripts/qa-lighthouse-readiness.mjs
      - name: Run Lighthouse CI
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jyc-lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
          include-hidden-files: true
