name: Temporary Build Log Capture
on:
  push:
    branches: [fix/v56-15-1-full-qa]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture build output
        run: |
          set +e
          npm run build > build-error.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "BUILD_EXIT_CODE=$code" >> build-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add build-error.log
            git commit -m "chore: capture temporary build error"
            git push
            exit "$code"
          fi
